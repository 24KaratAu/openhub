name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate Formatted Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## Release ${{ github.ref_name }} - $(date +'%Y-%m-%d')" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Highlights & Changes" >> RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --oneline | grep -v "Merge" | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
          else
            git log -n 10 --oneline | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release with Formatted Notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
