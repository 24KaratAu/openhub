[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhub-tui"
version = "0.1.1"
description = "Terminal discovery hub and package manager for AI coding tools, MCP servers, and agent skills."
readme = "README.md"
authors = [
    { name = "24KaratAu" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.40.0",
    "httpx>=0.24.0",
    "rapidfuzz>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/24KaratAu/openhub"
Repository = "https://github.com/24KaratAu/openhub"
Issues = "https://github.com/24KaratAu/openhub/issues"

[project.scripts]
openhub = "app.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]
